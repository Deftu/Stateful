kotlin.code.style=official

# The Kotlin/JS and wasm backends need real heap to compile the Compose runtime; the
# default exhausts itself with a GC overhead error.
org.gradle.jvmargs=-Xmx6G
kit.java.version=8

# Kit's multiplatform convention brings up jvm unconditionally and everything else on request.
kit.kmp.js=true
kit.kmp.wasm=true

# Native targets are declared per module instead. Kit's convention brings up a fixed desktop set,
# but the adapters cannot all support it — Compose Multiplatform stopped publishing for Intel
# macOS — so each module names what it actually supports.
kit.kmp.native=false

# The wasm target is browser-only; there is nothing here that a Node build would exercise
# which the JS target does not already cover.
kit.kmp.wasm.node=false

# The Elementa adapter resolves from Essential. Kit gates each Minecraft repository
# separately, so this enables that one and nothing else.
kit.repos.minecraft=true
kit.repos.minecraft.essential=true
project.name=stateful
project.group=dev.deftu
project.version=0.8.0
